<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pustaka Tautan YSKN</title>
<style>
:root{
  --p:hsl(168 72% 26%);--p-soft:hsl(168 45% 92%);--on-p:#fff;
  --a:hsl(38 92% 48%);--a-soft:hsl(40 95% 90%);
  --bg:hsl(160 25% 97%);--bg2:hsl(168 35% 93%);--surf:hsl(0 0% 100% / .82);--surf-s:#fff;
  --tx:hsl(180 20% 12%);--tx2:hsl(180 10% 36%);--bd:hsl(170 18% 85%);
  --ok:hsl(145 65% 28%);--err:hsl(4 70% 42%);--sh:0 6px 24px hsl(170 40% 20% / .10);
  --fs:clamp(.9rem,.85rem + .25vw,1rem);--pad:clamp(.875rem,.5rem + 1.6vw,2rem);
  --ease:cubic-bezier(.22,1,.36,1);--sw:17.5rem;--bn:calc(4.25rem + env(safe-area-inset-bottom,0px));
}
:root[data-theme=dark]{
  --p:hsl(166 52% 58%);--p-soft:hsl(168 30% 17%);--on-p:hsl(180 30% 8%);
  --a:hsl(40 90% 60%);--a-soft:hsl(38 40% 18%);
  --bg:hsl(180 20% 7%);--bg2:hsl(175 22% 11%);--surf:hsl(178 18% 13% / .8);--surf-s:hsl(178 16% 14%);
  --tx:hsl(160 20% 93%);--tx2:hsl(165 10% 68%);--bd:hsl(175 14% 22%);
  --ok:hsl(145 55% 60%);--err:hsl(5 85% 70%);--sh:0 8px 28px #0006;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{scroll-behavior:smooth}
body{font:var(--fs)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);
  background:radial-gradient(60rem 30rem at 0 0,var(--bg2),transparent),var(--bg);background-attachment:fixed;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ic{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{min-height:100dvh;display:flex;max-width:100dvw}
/* Sidebar / drawer */
.side{position:fixed;inset:0 auto 0 0;width:min(var(--sw),86dvw);z-index:40;display:flex;flex-direction:column;gap:.5rem;
  padding:calc(1rem + env(safe-area-inset-top,0px)) .875rem 1rem;background:var(--surf-s);border-right:1px solid var(--bd);
  transform:translateX(-102%);transition:transform .4s var(--ease),width .3s var(--ease);overflow-y:auto;overscroll-behavior:contain}
.side.open{transform:none;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:.75rem;padding:.25rem .5rem 1rem}
.logo{width:2.5rem;height:2.5rem;border-radius:.8rem;display:grid;place-items:center;font-weight:800;color:var(--on-p);
  background:linear-gradient(135deg,var(--p),hsl(190 60% 32%));box-shadow:0 4px 14px hsl(168 70% 30% / .4)}
.brand b{display:block;line-height:1.15}.brand small{color:var(--tx2);font-size:.75rem}
.nav-i{display:flex;align-items:center;gap:.75rem;width:100%;min-height:2.75rem;padding:.5rem .75rem;border-radius:.8rem;text-align:left;
  color:var(--tx2);transition:background .2s,color .2s,transform .15s}
.nav-i span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i:active{transform:scale(.97)}
.nav-i[aria-current=true]{background:var(--p-soft);color:var(--p);font-weight:600}
.nav-i .cnt{font-size:.75rem;background:var(--bg2);padding:.1rem .5rem;border-radius:99px}
.chev{transition:transform .25s}
.grp.open>.nav-i .chev{transform:rotate(180deg)}
.subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.grp.open .subs{grid-template-rows:1fr}
.subs>div{overflow:hidden;padding-left:1.25rem}
.subs .nav-i{min-height:2.5rem;font-size:.9em}
.sep{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);padding:.75rem .75rem .25rem}
.scrim{position:fixed;inset:0;background:#0007;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:35}
.scrim.on{opacity:1;pointer-events:auto}
.collapse-btn{display:none}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:var(--bn)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:calc(.625rem + env(safe-area-inset-top,0px)) var(--pad) .625rem;
  background:var(--surf);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--bd)}
.ib{width:2.75rem;height:2.75rem;border-radius:.9rem;display:grid;place-items:center;color:var(--tx2);transition:background .2s,transform .15s}
.ib:active{transform:scale(.92);background:var(--p-soft)}
.search{flex:1;min-width:0;position:relative}
.search .ic{position:absolute;left:.875rem;top:50%;translate:0 -50%;color:var(--tx2);pointer-events:none}
.search input{width:100%;height:2.75rem;padding:0 .875rem 0 2.75rem;border-radius:.9rem;border:1px solid var(--bd);background:var(--surf-s);outline:0;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--p);box-shadow:0 0 0 3px hsl(168 70% 40% / .25)}
.content{padding:var(--pad);display:flex;flex-direction:column;gap:1.25rem;container-type:inline-size;width:100%;max-width:90rem;margin-inline:auto}
.hero{border-radius:1.25rem;padding:clamp(1.1rem,3cqi,2rem);color:var(--on-p);background:linear-gradient(120deg,var(--p),hsl(192 62% 30%));position:relative;overflow:hidden}
:root[data-theme=dark] .hero{background:linear-gradient(120deg,hsl(168 40% 20%),hsl(192 40% 18%));color:var(--tx)}
.hero::after{content:"";position:absolute;right:-3rem;top:-3rem;width:12rem;aspect-ratio:1;border-radius:50%;background:radial-gradient(var(--a),transparent 70%);opacity:.45}
.hero h1{font-size:clamp(1.25rem,1rem + 1.6vw,2rem);line-height:1.2;position:relative}
.hero p{opacity:.9;margin-top:.25rem;position:relative;max-width:42rem}
.stats{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem;position:relative}
.stat{background:#ffffff26;backdrop-filter:blur(6px);border-radius:.8rem;padding:.4rem .9rem;font-size:.85rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad)}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:2.75rem;padding:0 1rem;border-radius:99px;border:1px solid var(--bd);background:var(--surf-s);white-space:nowrap;color:var(--tx2);transition:all .2s}
.chip[aria-pressed=true]{background:var(--p);color:var(--on-p);border-color:var(--p)}
.head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.head h2{font-size:clamp(1.05rem,.95rem + .6vw,1.35rem)}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 1.1rem;border-radius:.9rem;font-weight:600;background:var(--p);color:var(--on-p);transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--bg2);color:var(--tx)}
.btn.danger{background:var(--err);color:#fff}
.grid{display:grid;gap:clamp(.75rem,2cqi,1.25rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr))}
.card{background:var(--surf-s);border:1px solid var(--bd);border-radius:1.1rem;padding:1rem;display:flex;flex-direction:column;gap:.6rem;
  box-shadow:var(--sh);transition:transform .3s var(--ease),border-color .2s;animation:in .5s var(--ease) both;min-width:0}
.card .r1{display:flex;gap:.75rem;align-items:center}
.av{width:2.75rem;height:2.75rem;border-radius:.8rem;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.card h3{font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.card .host{font-size:.8rem;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{color:var(--tx2);font-size:.9rem;overflow-wrap:anywhere}
.tag{font-size:.75rem;color:var(--p);background:var(--p-soft);padding:.2rem .6rem;border-radius:99px;align-self:flex-start}
.acts{display:flex;gap:.25rem;margin-top:auto;padding-top:.25rem;align-items:center}
.acts a.btn{flex:1;justify-content:center}
.fav[aria-pressed=true]{color:var(--a)}.fav[aria-pressed=true] .ic{fill:var(--a)}
.empty{text-align:center;padding:3rem 1rem;color:var(--tx2);border:2px dashed var(--bd);border-radius:1.25rem}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
/* Bottom nav */
.bn{position:fixed;inset:auto .75rem calc(.5rem + env(safe-area-inset-bottom,0px)) .75rem;height:3.75rem;z-index:30;display:flex;justify-content:space-around;align-items:center;
  background:var(--surf);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--bd);border-radius:1.4rem;box-shadow:var(--sh)}
.bn button{flex:1;min-height:2.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.7rem;color:var(--tx2);transition:color .2s,transform .15s}
.bn button:active{transform:scale(.9)}
.bn button[aria-current=true]{color:var(--p);font-weight:600}
.bn .plus{flex:none;width:3.25rem;height:3.25rem;border-radius:1.1rem;background:var(--a);color:#1a1200;margin-top:-1.4rem;box-shadow:0 6px 18px hsl(38 90% 40% / .5)}
/* Modal */
dialog{border:0;border-radius:1.4rem;padding:0;width:min(32rem,calc(100dvw - 1.5rem));max-height:90dvh;background:var(--surf-s);color:var(--tx);box-shadow:0 20px 60px #0007;margin:auto}
dialog::backdrop{background:#0008;backdrop-filter:blur(4px)}
dialog[open]{animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.mb{padding:1.25rem;display:flex;flex-direction:column;gap:.875rem}
.mb label{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;font-weight:600}
.mb input,.mb select,.mb textarea{min-height:2.75rem;padding:.6rem .8rem;border-radius:.8rem;border:1px solid var(--bd);background:var(--bg);font-weight:400;outline:0;width:100%}
.mb input:focus,.mb select:focus,.mb textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px hsl(168 70% 40% / .25)}
.row{display:grid;grid-template-columns:1fr;gap:.875rem}
.mf{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(var(--bn) + .75rem);translate:-50% 0;z-index:60;background:var(--tx);color:var(--bg);padding:.65rem 1.1rem;border-radius:99px;font-size:.9rem;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateY(8px);max-width:90dvw}
.toast.on{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
@media (hover:hover){.card:hover{transform:translateY(-4px);border-color:var(--p)}.nav-i:hover,.ib:hover{background:var(--p-soft)}.btn:hover{box-shadow:0 6px 18px hsl(168 60% 30% / .35)}.chip:hover{border-color:var(--p)}}
@media (min-width:480px){.row{grid-template-columns:1fr 1fr}}
@media (min-width:768px){
  .side{transform:none;box-shadow:none;width:var(--sw);position:sticky;top:0;height:100dvh;flex:none}
  .app.mini{--sw:5rem}
  .app.mini .brand div,.app.mini .nav-i .t,.app.mini .cnt,.app.mini .chev,.app.mini .subs,.app.mini .sep{display:none}
  .app.mini .nav-i{justify-content:center}
  .collapse-btn{display:grid;margin-top:auto}
  .bn,.menu-btn,.scrim{display:none}
  .main{padding-bottom:0}
  .toast{bottom:1.5rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigasi utama">
    <div class="brand"><div class="logo">Y</div><div><b>YSKN</b><small>Pustaka Tautan</small></div></div>
    <nav id="nav"></nav>
    <button class="ib collapse-btn" id="collapse" aria-label="Ciutkan atau perluas bilah samping"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="ib menu-btn" id="menuBtn" aria-label="Buka menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
        <input id="q" type="search" placeholder="Cari tautan, kategori, atau catatan…" aria-label="Cari tautan"></div>
      <button class="ib" id="theme" aria-label="Ganti tema terang atau gelap"></button>
      <button class="btn" id="addTop" style="display:none"></button>
    </header>
    <main class="content" id="content" tabindex="-1">
      <section class="hero">
        <h1>Semua tautan penting yayasan, rapi di satu tempat</h1>
        <p>Kelola tautan untuk pemangku kepentingan, mitra, komunitas, dan relawan YSKN.</p>
        <div class="stats" id="stats"></div>
      </section>
      <div class="chips" id="chips" role="group" aria-label="Filter sub-folder"></div>
      <div class="head"><h2 id="title">Semua Tautan</h2><button class="btn ghost" id="addMain"></button></div>
      <section class="grid" id="grid" aria-live="polite"></section>
    </main>
  </div>
</div>
<nav class="bn" aria-label="Navigasi bawah">
  <button data-go="all" aria-current="true"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Beranda</button>
  <button data-go="fav"><svg class="ic" viewBox="0 0 24 24"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>Favorit</button>
  <button class="plus" id="addBn" aria-label="Tambah tautan"></button>
  <button data-go="cats"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Kategori</button>
  <button data-go="theme2"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Tema</button>
</nav>
<dialog id="dlg" aria-labelledby="dt">
  <form class="mb" id="form" method="dialog">
    <h2 id="dt">Tambah Tautan</h2>
    <label>Judul<input id="f-title" required maxlength="80" placeholder="Contoh: Portal Pelaporan Yayasan"></label>
    <label>Alamat URL<input id="f-url" required inputmode="url" placeholder="contoh.go.id/halaman"></label>
    <div class="row">
      <label>Kategori<select id="f-cat"></select></label>
      <label>Sub-folder<select id="f-sub"></select></label>
    </div>
    <label>Catatan (opsional)<textarea id="f-note" rows="2" maxlength="200" placeholder="Keterangan singkat…"></textarea></label>
    <div class="mf"><button type="button" class="btn ghost" id="cancel">Batal</button><button class="btn" type="submit">Simpan</button></div>
  </form>
</dialog>
<dialog id="del"><div class="mb"><h2>Hapus tautan?</h2><p id="delTxt"></p>
  <div class="mf"><button class="btn ghost" id="delNo">Batal</button><button class="btn danger" id="delYes">Hapus</button></div></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const I = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  star:'<polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  gov:'<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-7 10 7z"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',
  heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const TREE = [
  {id:"Stakeholder", icon:"gov", subs:["Pemerintah & Regulator","Donatur & Pendana","Pengurus & Pembina Yayasan","Media & Publikasi"]},
  {id:"Mitra", icon:"users", subs:["Mitra Program","Mitra Korporasi / CSR","Lembaga Pendidikan & Riset","Perjanjian & Dokumen Kerja Sama"]},
  {id:"Komunitas", icon:"chat", subs:["Grup & Forum (WhatsApp, Telegram, Facebook)","Media Sosial Resmi","Agenda & Kegiatan","Galeri & Dokumentasi"]},
  {id:"Relawan", icon:"heart", subs:["Pendaftaran & Rekrutmen","Jadwal & Penugasan","Panduan, SOP & Pelatihan","Pelaporan & Sertifikat"]}
];
const SEED = [
  ["AHU Online Kemenkumham","https://ahu.go.id","Stakeholder",0,"Legalitas dan perubahan data yayasan."],
  ["Kementerian Sosial RI","https://kemensos.go.id","Stakeholder",0,"Regulasi dan izin kegiatan sosial."],
  ["Portal Pajak DJP","https://pajak.go.id","Stakeholder",0,"Pelaporan pajak organisasi."],
  ["Laporan Donasi Tahunan","https://example.org/donasi","Stakeholder",1,"Ringkasan dana yang diterima."],
  ["Berita & Siaran Pers","https://example.org/media","Stakeholder",3,"Arsip publikasi media."],
  ["Daftar Mitra Program","https://example.org/mitra","Mitra",0,"Mitra pelaksana di lapangan."],
  ["Proposal CSR Perusahaan","https://example.org/csr","Mitra",1,"Draf dan status pengajuan."],
  ["Naskah Kerja Sama (MoU)","https://example.org/mou","Mitra",3,"Arsip perjanjian aktif."],
  ["Grup WhatsApp Komunitas","https://chat.whatsapp.com","Komunitas",0,"Tautan undangan grup utama."],
  ["Instagram Resmi YSKN","https://instagram.com","Komunitas",1,"Akun media sosial resmi."],
  ["Kalender Kegiatan","https://example.org/agenda","Komunitas",2,"Jadwal kegiatan bulanan."],
  ["Formulir Pendaftaran Relawan","https://example.org/daftar","Relawan",0,"Daftar menjadi relawan baru."],
  ["Panduan SOP Relawan","https://example.org/sop","Relawan",2,"Pedoman kerja dan pelatihan."]
].map((r,i)=>({id:"s"+i,title:r[0],url:r[1],cat:r[2],sub:TREE.find(t=>t.id===r[2]).subs[r[3]],note:r[4],fav:i%4===0}));

let state = {view:{t:"all"}, sub:null, q:"", items:[], theme:null, mini:false};
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
state.items = store.get("yskn_items") || SEED;
const save = () => store.set("yskn_items", state.items);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch { return u; } };
const hue = s => [...s].reduce((a,c)=>a+c.charCodeAt(0),0)*7 % 360;
const side = $("#side"), scrim = $("#scrim");

/* Tema */
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t){
  state.theme = t; document.documentElement.dataset.theme = t;
  $("#theme").innerHTML = ic(t==="dark"?"sun":"moon");
}
applyTheme(store.get("yskn_theme") || (mq.matches?"dark":"light"));
const toggleTheme = () => { const t = state.theme==="dark"?"light":"dark"; store.set("yskn_theme",t); applyTheme(t); };
$("#theme").onclick = toggleTheme;

/* Drawer */
const drawer = o => { side.classList.toggle("open", o); scrim.classList.toggle("on", o); };
$("#menuBtn").onclick = () => drawer(true);
scrim.onclick = () => drawer(false);
addEventListener("keydown", e => { if(e.key==="Escape") drawer(false); });
$("#collapse").onclick = () => $("#app").classList.toggle("mini");
matchMedia("(min-width:768px)").addEventListener("change", e => { if(e.matches) drawer(false); });

/* Navigasi */
const count = f => state.items.filter(f).length;
const isCur = (t,c) => state.view.t===t && (c===undefined || state.view.c===c);
function renderNav(){
  let h = `<button class="nav-i" data-v="all" aria-current="${isCur("all")}">${ic("home")}<span class="t">Semua Tautan</span><span class="cnt">${state.items.length}</span></button>
  <button class="nav-i" data-v="fav" aria-current="${isCur("fav")}">${ic("star")}<span class="t">Favorit</span><span class="cnt">${count(i=>i.fav)}</span></button>
  <div class="sep">Kategori</div>`;
  TREE.forEach(c => {
    const open = state.view.t==="cat" && state.view.c===c.id;
    h += `<div class="grp ${open?"open":""}"><button class="nav-i" data-v="cat" data-c="${c.id}" aria-current="${open}">${ic(c.icon)}<span class="t">${c.id}</span><span class="cnt">${count(i=>i.cat===c.id)}</span>${ic("chev").replace('class="ic"','class="ic chev"')}</button>
    <div class="subs"><div>${c.subs.map(s=>`<button class="nav-i" data-v="cat" data-c="${c.id}" data-s="${esc(s)}" aria-current="${open&&state.sub===s}"><span class="t">${esc(s)}</span><span class="cnt">${count(i=>i.sub===s)}</span></button>`).join("")}</div></div></div>`;
  });
  $("#nav").innerHTML = h;
  document.querySelectorAll(".bn button[data-go]").forEach(b => {
    const g=b.dataset.go; b.setAttribute("aria-current", g==="all"?isCur("all"):g==="fav"?isCur("fav"):g==="cats"?isCur("cat"):false);
  });
}
$("#nav").onclick = e => {
  const b = e.target.closest(".nav-i"); if(!b) return;
  const v = b.dataset.v;
  state.view = v==="cat" ? {t:"cat", c:b.dataset.c} : {t:v};
  state.sub = b.dataset.s || null;
  render();
  if(b.dataset.s || v!=="cat") drawer(false);
  scrollTo({top:0,behavior:"smooth"});
};
document.querySelectorAll(".bn button[data-go]").forEach(b => b.onclick = () => {
  const g = b.dataset.go;
  if(g==="cats") drawer(true);
  else if(g==="theme2") toggleTheme();
  else { state.view={t:g}; state.sub=null; render(); scrollTo({top:0,behavior:"smooth"}); }
});

/* Render */
function filtered(){
  const q = state.q.trim().toLowerCase(), v = state.view;
  return state.items.filter(i =>
    (v.t==="all" || (v.t==="fav" && i.fav) || (v.t==="cat" && i.cat===v.c && (!state.sub || i.sub===state.sub))) &&
    (!q || [i.title,i.url,i.cat,i.sub,i.note].join(" ").toLowerCase().includes(q)));
}
function render(){
  renderNav();
  const v = state.view, list = filtered();
  $("#title").textContent = v.t==="all"?"Semua Tautan":v.t==="fav"?"Tautan Favorit":(state.sub||v.c);
  $("#stats").innerHTML = `<span class="stat">${state.items.length} tautan</span><span class="stat">${count(i=>i.fav)} favorit</span><span class="stat">${TREE.length} kategori</span>`;
  const chips = $("#chips");
  if(v.t==="cat"){
    const c = TREE.find(t=>t.id===v.c);
    chips.hidden = false;
    chips.innerHTML = [null,...c.subs].map(s=>`<button class="chip" data-s="${s?esc(s):""}" aria-pressed="${state.sub===s}">${s?esc(s):"Semua"}</button>`).join("");
  } else { chips.hidden = true; chips.innerHTML = ""; }
  $("#grid").innerHTML = list.length ? list.map((i,n)=>`
    <article class="card" style="animation-delay:${Math.min(n,10)*40}ms">
      <div class="r1"><div class="av" style="background:hsl(${hue(i.title)} 55% 36%)">${esc(i.title[0].toUpperCase())}</div>
        <div style="min-width:0"><h3>${esc(i.title)}</h3><div class="host">${esc(host(i.url))}</div></div></div>
      ${i.note?`<p>${esc(i.note)}</p>`:""}
      <span class="tag">${esc(i.cat)} › ${esc(i.sub)}</span>
      <div class="acts"><a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${ic("ext")}Buka</a>
        <button class="ib fav" data-a="fav" data-id="${i.id}" aria-pressed="${i.fav}" aria-label="Tandai favorit">${ic("star")}</button>
        <button class="ib" data-a="del" data-id="${i.id}" aria-label="Hapus tautan">${ic("trash")}</button></div>
    </article>`).join("")
    : `<div class="empty" style="grid-column:1/-1"><b>Belum ada tautan</b><p>${state.q?"Tidak ada hasil untuk pencarian Anda.":"Tambahkan tautan pertama pada folder ini."}</p></div>`;
}
$("#chips").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; state.sub=b.dataset.s||null; render(); };
let tm; $("#q").oninput = e => { clearTimeout(tm); tm=setTimeout(()=>{state.q=e.target.value;render()},120); };

/* Aksi kartu */
let delId = null;
$("#grid").onclick = e => {
  const b = e.target.closest("[data-a]"); if(!b) return;
  const it = state.items.find(i=>i.id===b.dataset.id); if(!it) return;
  if(b.dataset.a==="fav"){ it.fav=!it.fav; save(); render(); toast(it.fav?"Ditambahkan ke favorit":"Dihapus dari favorit"); }
  else { delId=it.id; $("#delTxt").textContent=`“${it.title}” akan dihapus dari pustaka.`; $("#del").showModal(); }
};
$("#delNo").onclick = () => $("#del").close();
$("#delYes").onclick = () => { state.items=state.items.filter(i=>i.id!==delId); save(); $("#del").close(); render(); toast("Tautan dihapus"); };

/* Modal tambah */
const dlg = $("#dlg"), fc = $("#f-cat"), fs = $("#f-sub");
fc.innerHTML = TREE.map(t=>`<option>${t.id}</option>`).join("");
const fillSubs = (sel) => { fs.innerHTML = TREE.find(t=>t.id===fc.value).subs.map(s=>`<option ${s===sel?"selected":""}>${esc(s)}</option>`).join(""); };
fc.onchange = () => fillSubs();
function openAdd(){
  $("#form").reset();
  if(state.view.t==="cat") fc.value = state.view.c;
  fillSubs(state.sub); dlg.showModal(); $("#f-title").focus();
}
[$("#addMain"),$("#addBn"),$("#addTop")].forEach(b => b.onclick = openAdd);
$("#addMain").innerHTML = ic("plus")+"Tambah Tautan";
$("#addBn").innerHTML = ic("plus");
$("#cancel").onclick = () => dlg.close();
$("#form").onsubmit = e => {
  e.preventDefault();
  let url = $("#f-url").value.trim();
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;
  try { new URL(url); } catch { toast("Alamat URL tidak valid"); return; }
  state.items.unshift({id:"u"+Date.now(), title:$("#f-title").value.trim(), url, cat:fc.value, sub:fs.value, note:$("#f-note").value.trim(), fav:false});
  save(); dlg.close(); render(); toast("Tautan berhasil disimpan");
};
[dlg,$("#del")].forEach(d => d.addEventListener("click", e => { if(e.target===d) d.close(); }));

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2200); }
render();
})();
</script>
</body>
</html>
